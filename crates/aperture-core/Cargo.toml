[package]
name = "aperture-core"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Substrate-agnostic selective-disclosure engine for confidential on-chain balances"
repository = "https://github.com/psyto/aperture"

# L1 disclosure-workflow layer (substrate-agnostic) + L2 adapter trait
# + L3 Token-2022 / CSPL adapters. Consumed as an external dependency by downstream products.

[dependencies]
solana-zk-sdk = "7"
solana-zk-elgamal-proof-interface = "0.1.3"
serde = { version = "1", features = ["derive"] }
bytemuck = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
