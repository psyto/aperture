[package]
name = "aperture-flow-tests"
version = "0.1.0"
edition = "2021"
publish = false

# End-to-end: core (L1 issue + verify) wired to the on-chain Receipt Registry via LiteSVM.
# Prereq: `cd ../receipts && cargo build-sbf`.

[dev-dependencies]
aperture-core = { path = "../core" }
solana-zk-sdk = "7"
litesvm = "0.13"
solana-keypair = "3.1"
solana-signer = "3"
solana-pubkey = "3"
solana-instruction = "3"
solana-transaction = "3"
solana-account = "3"
solana-sdk-ids = "3"

[workspace]
