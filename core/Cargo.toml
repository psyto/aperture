[package]
name = "aperture-core"
version = "0.1.0"
edition = "2021"

# L1 disclosure-workflow layer (substrate-agnostic) + L2 adapter trait
# + L3 Token-2022 adapter. Built on the primitives proven in ../spike.

[dependencies]
solana-zk-sdk = "7"
solana-zk-elgamal-proof-interface = "0.1.3"
serde = { version = "1", features = ["derive"] }
bytemuck = "1"

[dev-dependencies]
serde_json = "1"
